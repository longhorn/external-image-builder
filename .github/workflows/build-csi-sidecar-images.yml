name: Build CSI Sidecar Images

on:
  workflow_dispatch:
    inputs:
      registry_name:
        description: "Docker registry name. For example: longhornio"
        default: "longhornio"
        required: true
      list_of_repo_branch_tag:
        description: "Space separated list of repo:branch:tag. For example:csi-attacher:longhorn-release-4.6.1:v4.6.1-20241007 csi-provisioner:longhorn-release-4.0.1:v4.6.1-20241007"
        required: true
      create_tag:
        description: "Create tag"
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.LONGHORN_GITHUB_BOT_APP_ID }}
        private-key: ${{ secrets.LONGHORN_GITHUB_BOT_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-contents: write

    - name: Authenticate gh CLI with App token
      run: |
        echo "${{ steps.app-token.outputs.token }}" | gh auth login --with-token

    - name: Create and push tags using gh
      if: ${{ inputs.create_tag == 'true' }}
      run: |
        for entry in ${{ inputs.list_of_repo_branch_tag }}; do
          tag=$(echo "$entry" | cut -d':' -f3)
          echo "Creating and pushing tag $tag"
          gh release create "$tag" --title "$tag" --notes "Automated release $tag"
        done

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Images
      run: bash ./scripts/build-csi-sidecar-images.sh "${{ inputs.registry_name }}" "${{ inputs.list_of_repo_branch_tag }}" "${{ inputs.create_tag }}"